# first up command: docker compose up --build
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # container_name は固定しない。worktree ごとに別プロジェクトとして <project>-app-1 で作られ、名前が衝突しないようにする
    # HMR を外から使えるように host/port を渡す
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        # node_modules がない or 空なら初回インストール
        if [ ! -d node_modules ] || [ -z "$$(ls -A node_modules 2>/dev/null || true)" ]; then
          echo "[compose] installing deps..."
          yarn install --frozen-lockfile
        fi
        echo "[compose] starting dev server..."
        exec yarn dev --host 0.0.0.0 --port 1234
    # NODE_ENV は設定せず、Parcel の既定（dev サーバーは development、build は production）に任せる
    # ここで固定すると exec で実行する yarn build にも効き、本番と異なる開発版の React が同梱される
    # Docker Desktop などでファイル監視が不安定な場合は次の 2 行のコメントアウトを外す
    # environment:
    #   - PARCEL_WATCH_INTERVAL=100
    # 別の worktree の開発サーバーと同時に動かすときは DEV_PORT でホスト側のポートだけを変える
    ports:
      - ${DEV_PORT:-1234}:1234
    # ホットリロード前提のマウント設定
    volumes:
      - ./:/app:delegated
      # node_modules はコンテナ側のものを使いたいので匿名ボリュームで保護
      - /app/node_modules
