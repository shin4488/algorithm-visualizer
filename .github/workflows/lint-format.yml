name: lint-and-format

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20' # LTS
          cache: 'yarn'

      - name: Enable Corepack (for modern Yarn)
        run: corepack enable

      - name: Install dependencies
        run: |
          # Yarn Classic なら --frozen-lockfile、Berry なら --immutable を使う想定
          yarn install --frozen-lockfile || yarn install --immutable

      - name: Run ESLint (check only)
        run: yarn lint

      - name: Run Prettier (check only)
        run: yarn format
