version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # マイナー・パッチ更新は 1 つの PR にまとめ、移行作業が要るメジャー更新はパッケージごとの PR に分ける
    # 版を揃えて上げる必要があるパッケージは、メジャー更新も同じ PR にまとめる
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      react-major:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - major
      mantine-major:
        patterns:
          - '@mantine/*'
        update-types:
          - major
      i18next-major:
        patterns:
          - i18next
          - react-i18next
        update-types:
          - major
      testing-library-major:
        patterns:
          - '@testing-library/*'
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - '*'
    ignore:
      # Node のメジャーバージョンは .nvmrc と揃えて上げるため、Dockerfile だけを変える更新は受けない
      - dependency-name: node
        update-types:
          - version-update:semver-major
